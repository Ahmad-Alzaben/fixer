# Builds Fixer for Android and iOS on every push to main and publishes a
# GitHub Release with the files attached.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_PASSWORD      key password (same as above if you pressed Enter)
#   ANDROID_KEY_ALIAS         key alias ("upload")
#
# iOS is built WITHOUT code signing (no Apple Developer account yet). The
# .ipa can be sideloaded with AltStore/Sideloadly, which re-sign it with your
# own Apple ID.

name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One release run at a time; a newer push cancels an older one in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.3'
  # Build numbers continue above the ones used for local builds (1-99), so
  # every CI APK installs as an update over the previous one.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: SQLite for database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APKs
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Read app version from pubspec.yaml
        id: version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          code=$((100 + BUILD_NUMBER))
          echo "version=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name (build $code)"

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS in the repository settings."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > android/key.properties

      - run: flutter pub get
      - name: Build APKs
        run: |
          flutter build apk --release --build-number=${{ steps.version.outputs.code }}
          flutter build apk --release --split-per-abi --build-number=${{ steps.version.outputs.code }}
          mkdir -p dist
          v=${{ steps.version.outputs.version }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Fixer-$v-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Fixer-$v-universal.apk"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign --build-number=$((100 + BUILD_NUMBER))
      - name: Package as .ipa
        run: |
          v=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry "Fixer-$v-ios-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          code=$((100 + BUILD_NUMBER))
          tag="v$VERSION-build.$code"
          cat > notes.md <<EOF
          Fixer $VERSION (build $code), built from ${GITHUB_SHA:0:7}.

          **Android**: install \`Fixer-$VERSION-arm64.apk\` on most phones (64-bit ARM), or \`-universal\` if unsure. Signed with the Fixer upload key, so it updates earlier installs.

          **iOS**: \`Fixer-$VERSION-ios-unsigned.ipa\` is not signed. Install it with AltStore or Sideloadly using your Apple ID.
          EOF
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fixer $VERSION (build $code)" \
            --notes-file notes.md \
            --latest
